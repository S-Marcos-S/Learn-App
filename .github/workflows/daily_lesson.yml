name: Gerador Diário de Aulas (LearnApp)

on:
  schedule:
    # Executa todo dia às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para salvar a nova aula no repositório

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências opcionais de IA
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai || true

      - name: Executar Robô de Pesquisa e Criação de Aulas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/daily_generator.py

      - name: Salvar nova aula gerada no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses.json js/courses.js
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada para commitar."
          else
            git commit -m "🤖 [Automático] Nova aula diária adicionada à trilha de C++"
            git push origin main
          fi
