name: Compilar APK Android em Kotlin

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK com Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Renomear APK para distribuição
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/LearnApp-v1.0.0.apk

      - name: Salvar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: LearnApp-Android-APK
          path: build-output/LearnApp-v1.0.0.apk
          retention-days: 30
