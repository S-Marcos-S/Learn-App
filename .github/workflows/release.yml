name: Publicar Release no GitHub com APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Compilar APK e Publicar Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK Android (Kotlin)
        run: |
          cd android
          gradle assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk LearnApp-${{ github.ref_name }}.apk

      - name: Publicar GitHub Release Oficial com APK Anexo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "⚡ LearnApp ${{ github.ref_name }}"
          files: |
            LearnApp-${{ github.ref_name }}.apk
          body: |
            ## 🎉 LearnApp ${{ github.ref_name }} - Pronto para Instalar no Android!

            Baixe o arquivo **`LearnApp-${{ github.ref_name }}.apk`** na seção **Assets** abaixo para instalar diretamente no seu celular Android.

            ---

            ### 🚀 Recursos Desta Versão:
            - 📱 **APK Nativo em Kotlin:** Funciona 100% offline com todo o conteúdo embutido, sem consumir dados.
            - 📳 **Ponte Nativa de Vibração:** O celular vibra de verdade ao interagir com os botões e lições.
            - 🗺️ **Trilha Estilo Duolingo:** Caminho em zigue-zague com nós 3D táteis para **Programação > C++**.
            - 🤖 **Robô Diário de IA:** Cria autonomamente novas lições todos os dias na sua trilha.
            - 🎮 **Botões Gigantes e Acessíveis:** Player focado com quizzes interativos e feedback imediato.
            - 🖥️ **Suporte Desktop:** Também roda em navegadores PC com atalhos de teclado e 3 colunas.

            ---

            ### 📲 Como Instalar o APK no Android:
            1. No seu celular Android, baixe o arquivo `LearnApp-${{ github.ref_name }}.apk` abaixo.
            2. Toque no arquivo baixado e selecione **Instalar** (permita "Instalar aplicativos de fontes desconhecidas" se solicitado).
            3. Pronto! O LearnApp estará instalado na sua lista de aplicativos com ícone próprio e funcionamento offline.
          draft: false
          prerelease: false
